<!DOCTYPE html>
<html>
    <head>
        <title>Alexandria</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1> Alexandria</h1>
        <form method="post">
            <input type="text" name="title" placeholder="Title" required>
            <input type="text" name="site" placeholder="Site (e.g. Webtoons)">
            <input type="number" name="progress" placeholder="Chapter or Episode" required>
            <select name="type">
                <option>Manga</option>
                <option>Show</option>
            </select>
            <select name="status">
                <option>reading/watching</option>
                <option>completed</option>
            </select>
            <button type="submit">Add</button>
        </form>
        {% for entry in entries %}
        <div class="entry">
            <p>{{entry.title}}, {{entry.type}}, {{entry.status}}, {{entry.site}}, Chapter/Episode {{entry.progress}}</p>
            <div class="actions">
            <form method="post" action="/increment/{{entry.id}}">
                <button type="submit">+1</button>
            </form>
            <form method="post" action="/delete/{{entry.id}}">
                <button type="submit">Delete</button>
            </form>
            <form method="post" action="/update/{{entry.id}}">
                <input type="number" name="progress" value="{{entry.progress}}" min="0" required>
                <button type="submit">Update</button>
            </form>
            </div>
        </div>    
        {% endfor %}
    </body>
</html>
